name: Contract Export Integrity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify all contract namespaces and preserved exports with native Node
        run: node --import tsx tests/service/verify-contract-exports.mjs .
      - name: Run the complete existing and regression suite
        run: npm test
      - run: npm audit --omit=dev
